name: flight-platform

x-airflow-common: &airflow-common
  build: ./docker/airflow
  image: flight-airflow:latest
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    KAFKA_BOOTSTRAP: kafka:9092
    S3_ENDPOINT: http://seaweedfs:8333
    S3_ACCESS_KEY: ${S3_ACCESS_KEY}
    S3_SECRET_KEY: ${S3_SECRET_KEY}
    LAKE_BUCKET: ${LAKE_BUCKET}
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./spark_jobs:/opt/airflow/spark_jobs
    - airflow-logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy
    kafka:
      condition: service_healthy
    seaweedfs:
      condition: service_healthy

services:
  # ---------- Брокер сообщений ----------
  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    mem_limit: 1g
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_HEAP_OPTS: -Xms512m -Xmx768m
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  kafka-init:
    image: apache/kafka:3.9.0
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic flights.raw --partitions 3 --replication-factor 1
    restart: "no"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    mem_limit: 512m
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: flight-platform
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "false"
    depends_on:
      kafka:
        condition: service_healthy

  # ---------- Источник данных: ADS-B API -> Kafka ----------
  producer:
    build:
      context: .
      dockerfile: docker/producer/Dockerfile
    image: flight-producer:latest
    container_name: producer
    mem_limit: 256m
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC: flights.raw
      POLL_INTERVAL_SEC: ${POLL_INTERVAL_SEC}
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  # ---------- Lakehouse-хранилище (S3-совместимое, SeaweedFS) ----------
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: seaweedfs
    mem_limit: 768m
    ports:
      - "8333:8333"   # S3 API
      - "8888:8888"   # Filer UI (просмотр файлов)
      - "9333:9333"   # Master UI
    entrypoint: ["/bin/sh", "/seaweed-entrypoint.sh"]
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    volumes:
      - ./docker/seaweedfs/entrypoint.sh:/seaweed-entrypoint.sh:ro
      - lake-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8888/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  s3-init:
    image: chrislusf/seaweedfs:latest
    container_name: s3-init
    depends_on:
      seaweedfs:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - echo "s3.bucket.create -name ${LAKE_BUCKET}" | weed shell -master=seaweedfs:9333
    restart: "no"

  # ---------- Оркестрация ----------
  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        airflow db migrate &&
        airflow users create --username ${AIRFLOW_ADMIN_USER} --password ${AIRFLOW_ADMIN_PASSWORD} --firstname Admin --lastname Admin --role Admin --email admin@example.com || true
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    command: webserver
    mem_limit: 1280m
    ports:
      - "8081:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: scheduler
    mem_limit: 3g
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # ---------- Дашборды и ИИ-агент ----------
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    image: flight-app:latest
    container_name: app
    mem_limit: 1g
    ports:
      - "8501:8501"
    environment:
      S3_ENDPOINT: http://seaweedfs:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      LAKE_BUCKET: ${LAKE_BUCKET}
      OLLAMA_URL: ${OLLAMA_URL}
      OLLAMA_MODEL: ${OLLAMA_MODEL}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      seaweedfs:
        condition: service_healthy
    restart: unless-stopped

  # ---------- Метаданные Airflow ----------
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    mem_limit: 256m
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      POSTGRES_DB: airflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kafka-data:
  lake-data:
  postgres-data:
  airflow-logs:
